<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopify UAT Checklist</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f8fafc;--bg3:#f1f5f9;
  --text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --bd:#e2e8f0;--bd2:#cbd5e1;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-text:#1d4ed8;--blue-bd:#93c5fd;
  --green:#166534;--green-bg:#f0fdf4;--green-bd:#86efac;
  --red:#991b1b;--red-bg:#fef2f2;--red-bd:#fca5a5;
  --amber:#92400e;--amber-bg:#fffbeb;--amber-bd:#fcd34d;
  --r:8px;--rl:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:var(--text);font-size:14px}
.app{max-width:860px;margin:0 auto;min-height:100vh}

.hdr{padding:1rem 1.25rem .65rem;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hdr h1{font-size:16px;font-weight:600}
.hdr p{font-size:12px;color:var(--text2);margin-top:3px}
#langBtn{flex-shrink:0;margin-top:2px;padding:4px 12px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--bg2);color:var(--text2);font-size:12px;font-weight:500;cursor:pointer}

.locale-bar{display:flex;gap:6px;padding:.65rem 1.25rem;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.loc{padding:5px 13px;border-radius:var(--r);border:1px solid var(--bd2);background:#fff;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer}
.loc.on{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue-bd)}

.prog{padding:.45rem 1.25rem;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.prog-track{flex:1;height:5px;background:var(--bd);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:#22c55e;border-radius:3px;transition:width .3s}
.prog-txt{font-size:11px;color:var(--text2);white-space:nowrap}

.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--bd);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.5rem .9rem;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.bx{display:inline-block;margin-left:4px;font-size:10px;padding:1px 5px;border-radius:8px;font-weight:400}
.bx-f{background:var(--red-bg);color:var(--red)}
.bx-ok{background:var(--green-bg);color:var(--green)}

.ph{padding:.6rem 1.25rem;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph-l{flex:1;min-width:0}
.ph-title{font-size:13px;font-weight:600}
.ph-url{font-size:10px;color:var(--text3);margin-top:2px;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:var(--r);border:1px solid var(--bd2);background:#fff;color:var(--text2);font-size:12px;text-decoration:none;white-space:nowrap;flex-shrink:0}

.panel{padding:1rem 1.25rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media(max-width:540px){.panel{grid-template-columns:1fr}}
.panel-note{grid-column:1/-1;padding:.65rem 1rem;border-radius:var(--r);background:var(--amber-bg);border:1px solid var(--amber-bd);font-size:12px;color:var(--amber);line-height:1.5}
.card{display:flex;flex-direction:column;gap:7px;padding:1rem;border-radius:var(--rl);border:1px solid var(--bd);background:#fff;min-width:0;overflow:hidden}
.card-tag{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.card-name{font-size:14px;font-weight:600}
.card-url{font-size:10px;color:var(--text3);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.card-status{font-size:11px;color:var(--text2)}
.card-status.sf{color:var(--red)}.card-status.sok{color:var(--green)}
.card-jump{display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--blue-bd);background:var(--blue-bg);color:var(--blue-text);font-size:12px;font-weight:500;text-decoration:none;margin-top:4px}
.card-cl{font-size:11px;color:var(--text2);background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:5px 10px;cursor:pointer;text-align:center;width:100%}

.back-bar{display:flex;align-items:center;gap:8px;padding:.5rem 1.25rem;border-bottom:1px solid var(--bd);background:var(--bg2);flex-wrap:wrap}
.back-btn{font-size:12px;color:var(--text2);background:#fff;border:1px solid var(--bd2);border-radius:var(--r);padding:4px 10px;cursor:pointer;flex-shrink:0}
.back-name{font-size:13px;font-weight:600}
.back-tmpl{font-size:11px;color:var(--text3)}
.back-open{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--blue-text);text-decoration:none;padding:4px 10px;border:1px solid var(--blue-bd);border-radius:var(--r);flex-shrink:0}

.sec-hdr{padding:.4rem 1.25rem;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px}
.stag{padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600}
.sf{background:var(--blue-bg);color:var(--blue-text)}
.su{background:var(--amber-bg);color:var(--amber)}
.sl{background:var(--green-bg);color:var(--green)}

.row{display:flex;align-items:flex-start;gap:10px;padding:.6rem 1.25rem;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:none}
.row.dp{background:var(--green-bg)}.row.df{background:var(--red-bg)}.row.dn{background:var(--amber-bg)}
.ri{flex:1;min-width:0}
.rm{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.rno{font-size:10px;color:var(--text3);font-family:monospace}
.rlink{display:inline-flex;align-items:center;gap:2px;font-size:10px;color:var(--blue-text);text-decoration:none;padding:1px 6px;border-radius:4px;border:1px solid var(--blue-bd)}
.rtxt{font-size:13px;line-height:1.5}
.rexp{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.4}
.rnote{font-size:11px;color:var(--amber);margin-top:4px;padding:4px 8px;background:var(--amber-bg);border-radius:4px;line-height:1.5;border:1px solid var(--amber-bd)}
.rbtns{display:flex;gap:4px;flex-shrink:0;padding-top:2px}
.rb{width:32px;height:28px;border-radius:var(--r);border:1px solid var(--bd2);background:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rb.rp{background:var(--green-bg);border-color:var(--green-bd);color:var(--green);font-weight:600}
.rb.rf{background:var(--red-bg);border-color:var(--red-bd);color:var(--red);font-weight:600}
.rb.rn{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber);font-weight:600}
.ev-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.ev-btn,.ev-remove{padding:4px 8px;border-radius:var(--r);border:1px solid var(--bd2);background:#fff;color:var(--text2);font-size:11px;cursor:pointer}
.ev-btn:hover,.ev-remove:hover{border-color:var(--blue-bd);color:var(--blue-text)}
.ev-empty{font-size:11px;color:var(--text3)}
.ev-thumb{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:220px;padding:3px 7px 3px 3px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg2);font-size:11px;color:var(--text2);text-decoration:none}
.ev-thumb img{width:34px;height:24px;object-fit:cover;border-radius:5px;border:1px solid var(--bd2);background:#fff;flex-shrink:0}
.ev-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.note-row{display:flex;align-items:flex-start;gap:10px;padding:.6rem 1.25rem;border-bottom:1px solid var(--bd);background:var(--bg2)}
.note-lbl{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;padding-top:6px;min-width:90px}
.note-row textarea{flex:1;font-size:12px;font-family:inherit;border:1px solid var(--bd2);border-radius:var(--r);padding:6px 9px;background:#fff;color:var(--text);resize:vertical;min-height:40px;line-height:1.5}
.note-row textarea:focus{outline:none;border-color:var(--blue)}

.footer{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--bd2);padding:.55rem 1.25rem;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fst{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px}
.fst b{font-weight:600;font-size:13px}
.fp{color:var(--green)}.ff{color:var(--red)}.fn{color:var(--amber)}
.exp{margin-left:auto;font-size:12px;padding:5px 12px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--bg2);color:var(--text2);cursor:pointer}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:var(--rl);border:1px solid var(--bd2);width:100%;max-width:640px;max-height:80vh;display:flex;flex-direction:column}
.modal-hdr{padding:1rem 1.25rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.modal-hdr h2{font-size:14px;font-weight:600}
.modal-x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2);line-height:1}
.modal-body{padding:1rem 1.25rem;overflow-y:auto;flex:1}
.modal-body textarea{width:100%;height:320px;font-family:monospace;font-size:11px;border:1px solid var(--bd2);border-radius:var(--r);padding:8px;background:var(--bg2);color:var(--text);resize:none}
.modal-ft{padding:.75rem 1.25rem;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.btn-cl{padding:6px 14px;border-radius:var(--r);border:1px solid var(--bd2);background:#fff;color:var(--text2);font-size:13px;cursor:pointer}
.btn-cp{padding:6px 14px;border-radius:var(--r);border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:500;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div><h1 id="H_title">Shopify UAT Checklist</h1><p id="H_sub">diy-booknookkit.com · Select locale → page → open → mark results</p></div>
    <button id="langBtn" onclick="toggleLang()">中文</button>
  </div>
  <div class="locale-bar" id="localeBar"></div>
  <div class="prog" id="progBar" style="display:none">
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-txt" id="progTxt"></div>
  </div>
  <div class="tabs" id="tabBar" style="display:none"></div>
  <div id="pageHead" style="display:none"><div class="ph" id="pageHeadInner"></div></div>
  <div id="body"></div>
  <div class="footer" id="footer" style="display:none">
    <div class="fst"><span id="L_pass">Pass</span> <b class="fp" id="fPass">0</b></div>
    <div class="fst"><span id="L_fail">Fail</span> <b class="ff" id="fFail">0</b></div>
    <div class="fst"><span id="L_na">N/A</span>  <b class="fn" id="fNA">0</b></div>
    <button class="exp" id="expBtn" onclick="openExport()">Export summary ↗</button>
  </div>
</div>

<input id="evidenceInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none">

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-hdr"><h2 id="L_modalTitle">UAT Summary Export</h2><button class="modal-x" onclick="closeExport()">×</button></div>
    <div class="modal-body"><textarea id="exportTa" readonly></textarea></div>
    <div class="modal-ft">
      <button class="btn-cl" onclick="closeExport()" id="L_close">Close</button>
      <button class="btn-cp" id="copyBtn" onclick="doCopy()">Copy to clipboard</button>
    </div>
  </div>
</div>

<script>
// ─── Language ────────────────────────────────────────────────────────────────
var LNG = 'en';

var EN = {

  tabs:{home:'首页',collection:'分类页',product:'产品页',cart:'购物车',checkout:'结账',thankyou:'感谢页',faq:'常见问题',policy:'政策页'},
  openPage2:{home:'打开首页',collection:'打开分类页',cart:'打开购物车',checkout:'打开结账页',thankyou:'打开感谢页',faq:'打开 FAQ'},
  sec:{func:'功能测试',ux:'交互 & 动效',lang:'语言 & 本地化'},
};
function L(k){ return (LNG==='zh'?ZH:EN)[k]; }

function toggleLang(){
  LNG = LNG==='en'?'zh':'en';
  applyStaticLang();
  if(activeSite) renderAll();
}
function applyStaticLang(){
  document.getElementById('H_title').textContent = L('title');
  document.getElementById('H_sub').textContent = L('sub');
  document.getElementById('langBtn').textContent = L('langBtn');
  document.getElementById('L_pass').textContent = L('pass');
  document.getElementById('L_fail').textContent = L('fail');
  document.getElementById('L_na').textContent = L('na');
  document.getElementById('expBtn').textContent = L('export');
  document.getElementById('L_modalTitle').textContent = L('modalTitle');
  document.getElementById('L_close').textContent = L('close');
  document.getElementById('copyBtn').textContent = L('copy');
}

// ─── Item translations ────────────────────────────────────────────────────────
var ZH_ITEMS = {
  'H-01':{t:'页面正常加载，无报错',e:'HTTP 200，所有资源正常加载'},

  'H-UX1':{t:'导航下拉菜单动效流畅',e:'无卡顿，过渡自然'},
  'H-UX2':{t:'商品卡片 Hover 效果正常',e:'响应及时，无闪烁'},

  'C-06':{t:'点击卡片跳转至正确产品页',e:'URL 正确，商品信息一致'},

  'C-UX2':{t:'移动端 1-2 列自适应，无溢出',e:'布局整洁，图片不变形'},
  'C-UX3':{t:'加载更多/无限滚动触发及时',e:'接近底部时自动加载下一批'},
  'C-L1':{t:'分类标题/描述措辞自然',e:'无机器直译痕迹'},
  'C-L2':{t:'筛选标签文字本地化正确',e:'颜色、尺码、类别名称符合当地表达'},
  'P-01':{t:'产品标题、价格显示正确',e:'与 Shopify 后台一致'},
  'P-02':{t:'产品图片及轮播功能正常',e:'缩略图可点击，主图同步更新'},
  'P-03':{t:'变体选择切换正确',e:'切换后图片和价格同步更新'},
  'P-04':{t:'加入购物车按钮功能正常',e:'Cart 数量 +1，侧边栏弹出'},

var activeSite=null, activePage='home';
var STATE={}, NOTES={}, EVIDENCE={};

function initState(){
  SITES.forEach(function(s){
    STATE[s.id]={}; NOTES[s.id]={}; EVIDENCE[s.id]={};
    PAGES.forEach(function(pg){
      if(pg.isProduct){
        PRODUCTS.forEach(function(pr){
          PROD_SECS.forEach(function(sec){ sec.items.forEach(function(item){
            if(item.type==='text') NOTES[s.id][pr.key+'_'+item.no]='';
            else STATE[s.id][pr.key+'_'+item.no]=null;
          });});
        });
      } else if(pg.isPolicy){
        POLICIES.forEach(function(po){
          po.items.forEach(function(item){ STATE[s.id][po.key+'_'+item.no]=null; });
          POLICY_SHARED.forEach(function(sec){ sec.items.forEach(function(item){
            if(item.type==='text') NOTES[s.id][po.key+'_'+item.no]='';
            else STATE[s.id][po.key+'_'+item.no]=null;
          });});
        });
      } else {
        pg.sections.forEach(function(sec){ sec.items.forEach(function(item){
          if(item.type==='text') NOTES[s.id][item.no]='';
          else STATE[s.id][item.no]=null;
        });});
      }
    });
  });
}
initState();

function curSite(){ return SITES.find(function(s){return s.id===activeSite;}); }
function curPage(){ return PAGES.find(function(p){return p.key===activePage;}); }

// ─── Count ────────────────────────────────────────────────────────────────────
function countPg(pg){
  var f=0,d=0,tot=0;
  function chk(k){ tot++; var v=STATE[activeSite][k]; if(v==='fail')f++; if(v!==null)d++; }
  if(pg.isProduct){
    PRODUCTS.forEach(function(pr){ PROD_SECS.forEach(function(sec){ sec.items.forEach(function(item){ if(item.type!=='text') chk(pr.key+'_'+item.no); }); }); });
  } else if(pg.isPolicy){
    POLICIES.forEach(function(po){
      po.items.forEach(function(item){ chk(po.key+'_'+item.no); });
      POLICY_SHARED.forEach(function(sec){ sec.items.forEach(function(item){ if(item.type!=='text') chk(po.key+'_'+item.no); }); });
    });
  } else {
    pg.sections.forEach(function(sec){ sec.items.forEach(function(item){ if(item.type!=='text') chk(item.no); }); });
  }
  return {f:f,d:d,tot:tot};
}

// ─── Render helpers ────────────────────────────────────────────────────────────
function el(tag,cls,html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }
function esc(v){
  return String(v||'').replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var TAG_CLS={func:'sf',ux:'su',lang:'sl'};

function getEvidence(k){
  return activeSite && EVIDENCE[activeSite] ? EVIDENCE[activeSite][k] : null;
}

function renderEvidenceControls(k){
  var ev=getEvidence(k);
  var html='<div class="ev-actions" data-k="'+esc(k)+'">'+
    '<button class="ev-btn" type="button" data-act="upload" data-k="'+esc(k)+'">'+L('uploadImg')+'</button>'+
    '<button class="ev-btn" type="button" data-act="capture" data-k="'+esc(k)+'" title="'+esc(L('shotHint'))+'">'+L('captureImg')+'</button>';
  if(ev){
    html+='<a class="ev-thumb" href="'+ev.dataUrl+'" download="'+esc(ev.name)+'" target="_blank" title="'+esc(ev.name)+'">'+
      '<img src="'+ev.dataUrl+'" alt="'+esc(L('evidence'))+'"><span class="ev-name">'+esc(ev.name)+'</span></a>'+
      '<button class="ev-remove" type="button" data-act="remove" data-k="'+esc(k)+'">'+L('removeEvidence')+'</button>';
  } else {
    html+='<span class="ev-empty">'+L('noEvidence')+'</span>';
  }
  return html+'</div>';
}

function buildRows(sections, getKey, getUrl){
  var frag=document.createDocumentFragment();
  sections.forEach(function(sec){
    if(sec.isNotes){
      sec.items.forEach(function(item){
        var nk=getKey(item.no);
        var zhN = LNG==='zh' && ZH_ITEMS[item.no];
        var lbl = zhN ? zhN.t||item.label : item.label;
        var ph  = zhN ? zhN.e||item.placeholder : item.placeholder;
        var row=el('div','note-row');
        var label=el('div','note-lbl',lbl);
        var ta=el('textarea');
        ta.placeholder=ph||'';
        ta.value=NOTES[activeSite][nk]||'';
        ta.addEventListener('input',function(){ NOTES[activeSite][nk]=ta.value; });
        row.appendChild(label); row.appendChild(ta);
        frag.appendChild(row);
      });
      return;
    }
    var secEl=el('div');
    var secLbl = LNG==='zh' ? (ZH.sec[sec.tag]||sec.label) : sec.label;
    var hdr=el('div','sec-hdr','<span class="stag '+TAG_CLS[sec.tag]+'">'+secLbl+'</span>'+secLbl);
    secEl.appendChild(hdr);
    sec.items.forEach(function(item){
      var k=getKey(item.no);
      var cur=STATE[activeSite][k];
      var zh=it(item.no);
      var txt=zh?zh.t:item.text;
      var exp=zh?zh.e:item.expect;
      var cls='row'+(cur?{pass:' dp',fail:' df',na:' dn'}[cur]||'':'');
      var row=el('div',cls);
      var noteHtml=item.isNote?'<div class="rnote">'+exp+'</div>':'';
      row.innerHTML='<div class="ri"><div class="rm"><span class="rno">'+item.no+'</span><a class="rlink" href="'+getUrl()+'" target="_blank">↗ '+(LNG==='zh'?'打开':'open')+'</a></div><div class="rtxt">'+txt+'</div>'+(item.isNote?'':('<div class="rexp">'+exp+'</div>'))+noteHtml+renderEvidenceControls(k)+'</div><div class="rbtns"><button class="rb'+(cur==='pass'?' rp':'')+'" data-k="'+k+'" data-v="pass">✓</button><button class="rb'+(cur==='fail'?' rf':'')+'" data-k="'+k+'" data-v="fail">✗</button><button class="rb'+(cur==='na'?' rn':'')+'" data-k="'+k+'" data-v="na">—</button></div>';
      secEl.appendChild(row);
    });
    frag.appendChild(secEl);
  });
  frag.querySelectorAll && frag.querySelectorAll('.rb'); // no-op
  return frag;
}

function attachBtns(container){
  container.querySelectorAll('.rb').forEach(function(btn){
    btn.addEventListener('click',function(){
      var k=btn.dataset.k, v=btn.dataset.v;
      STATE[activeSite][k] = STATE[activeSite][k]===v ? null : v;
      renderPage(); updateProg(); updateFooter(); updateTabs();
    });
  });
}

var pendingEvidenceKey=null;

function initEvidenceInput(){
  var input=document.getElementById('evidenceInput');
  input.addEventListener('change',function(){
    var file=input.files && input.files[0];
    var k=pendingEvidenceKey;
    input.value='';
    pendingEvidenceKey=null;
    if(file && k) readEvidenceFile(k,file);
  });
  document.getElementById('body').addEventListener('click',function(e){
    var btn=e.target.closest && e.target.closest('.ev-btn,.ev-remove');
    if(!btn || !this.contains(btn)) return;
    var k=btn.dataset.k;
    if(btn.dataset.act==='upload') openEvidencePicker(k);
    if(btn.dataset.act==='capture') captureEvidence(k);
    if(btn.dataset.act==='remove') setEvidence(k,null);
  });
}

function openEvidencePicker(k){
  pendingEvidenceKey=k;
  document.getElementById('evidenceInput').click();
}

function readEvidenceFile(k,file){
  if(!/^image\/(png|jpe?g|webp|gif)$/i.test(file.type||'')){
    alert(L('badImage'));
    return;
  }
  var reader=new FileReader();
  reader.onload=function(){
    setEvidence(k,{name:file.name||'evidence-image',dataUrl:String(reader.result),capturedAt:new Date().toISOString()});
  };
  reader.onerror=function(){ alert(L('readImageFail')); };
  reader.readAsDataURL(file);
}

function getDisplayMediaOptions(){
  return {
    video:{displaySurface:"browser"},
    audio:false,
    preferCurrentTab:false,
    selfBrowserSurface:"exclude",
    surfaceSwitching:"include",
    monitorTypeSurfaces:"include"
  };
}

async function captureEvidence(k){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
    alert(L('shotUnsupported'));
    return;
  }
  var stream;
  try{
    stream=await navigator.mediaDevices.getDisplayMedia(getDisplayMediaOptions());
    var video=document.createElement('video');
    video.srcObject=stream;
    await new Promise(function(resolve){ video.onloadedmetadata=resolve; });
    await video.play();
    var canvas=document.createElement('canvas');
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    if(!canvas.width || !canvas.height) throw new Error('No video frame captured');
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
    var name='screenshot-'+new Date().toISOString().replace(/[:.]/g,'-')+'.jpg';
    setEvidence(k,{name:name,dataUrl:canvas.toDataURL('image/jpeg',0.84),capturedAt:new Date().toISOString()});
  }catch(err){
    alert(L('shotCancelled'));
  }finally{
    if(stream) stream.getTracks().forEach(function(track){ track.stop(); });
  }
}

function setEvidence(k,ev){
  if(!EVIDENCE[activeSite]) EVIDENCE[activeSite]={};
  if(ev) EVIDENCE[activeSite][k]=ev;
  else delete EVIDENCE[activeSite][k];
  refreshEvidence(k);
}

function refreshEvidence(k){
  document.querySelectorAll('.ev-actions').forEach(function(node){
    if(node.dataset.k===k) node.outerHTML=renderEvidenceControls(k);
  });
}

function evidenceText(k){
  var ev=getEvidence(k);
  return ev ? ' · '+L('evidence')+' '+(ev.name||'1 image') : '';
}

// ─── Panels ──────────────────────────────────────────────────────────────────
function statusStr(pass,fail,done,tot){
  if(done===0) return L('notStarted');
  var s=done+'/'+tot+' '+L('tested');
  if(fail>0) s+=' · '+fail+(LNG==='zh'?' 失败':' fail');
  if(pass===tot) s+=L('allPass');
  return s;
}

function renderProductPanel(){
  var s=curSite(), body=document.getElementById('body'); body.innerHTML='';
  var panel=el('div','panel');
  var note=el('div','panel-note'); note.innerHTML=L('sellyNote');
  panel.appendChild(note);
  PRODUCTS.forEach(function(pr){
    var url=pUrl(s.prefix,pr);
    var pass=0,fail=0,done=0,tot=0;
    PROD_SECS.forEach(function(sec){ sec.items.forEach(function(item){
      if(item.type==='text') return; tot++;
      var v=STATE[activeSite][pr.key+'_'+item.no];
      if(v==='pass')pass++; if(v==='fail')fail++; if(v!==null)done++;
    });});
    var sCls=fail>0?'sf':done===tot&&tot>0?'sok':'';
    var card=el('div','card');
    card.innerHTML='<div class="card-tag">Template: '+pr.template+'</div><div class="card-name">'+pr.name+'</div><div class="card-url">'+url+'</div><div class="card-status '+sCls+'">'+statusStr(pass,fail,done,tot)+'</div><a class="card-jump" href="'+url+'" target="_blank">'+(LNG==='zh'?'测试 ':'Test ')+pr.name+' ↗</a>';
    var clBtn=el('button','card-cl'); clBtn.textContent=L('fillChecklist');
    clBtn.onclick=function(){ renderProductChecklist(pr); };
    card.appendChild(clBtn); panel.appendChild(card);
  });
  body.appendChild(panel);
}

function renderProductChecklist(pr){
  var s=curSite(), url=pUrl(s.prefix,pr);
  var body=document.getElementById('body'); body.innerHTML='';
  var bb=el('div','back-bar');
  bb.innerHTML='<button class="back-btn" id="backBtn">'+L('backProducts')+'</button><span class="back-name">'+pr.name+'</span><span class="back-tmpl">Template: '+pr.template+'</span><a class="back-open" href="'+url+'" target="_blank">'+L('openProduct')+'</a>';
  body.appendChild(bb);
  document.getElementById('backBtn').onclick=function(){ renderProductPanel(); };
  var frag=buildRows(PROD_SECS,function(no){ return pr.key+'_'+no; },function(){ return url; });
  body.appendChild(frag);
  attachBtns(body);
}

function renderPolicyPanel(){
  var s=curSite(), body=document.getElementById('body'); body.innerHTML='';
  var panel=el('div','panel');
  POLICIES.forEach(function(po){
    var url='https://diy-booknookkit.com/'+s.prefix+po.path;
    var pass=0,fail=0,done=0,tot=0;
    po.items.forEach(function(item){ tot++; var v=STATE[activeSite][po.key+'_'+item.no]; if(v==='pass')pass++; if(v==='fail')fail++; if(v!==null)done++; });
    POLICY_SHARED.forEach(function(sec){ sec.items.forEach(function(item){ if(item.type==='text') return; tot++; var v=STATE[activeSite][po.key+'_'+item.no]; if(v==='pass')pass++; if(v==='fail')fail++; if(v!==null)done++; }); });
    var sCls=fail>0?'sf':done===tot&&tot>0?'sok':'';
    var card=el('div','card');
    card.innerHTML='<div class="card-name">'+po.name+'</div><div class="card-url">'+url+'</div><div class="card-status '+sCls+'">'+statusStr(pass,fail,done,tot)+'</div><a class="card-jump" href="'+url+'" target="_blank">'+(LNG==='zh'?'打开 ':'Open ')+po.name+' ↗</a>';
    var clBtn=el('button','card-cl'); clBtn.textContent=L('fillChecklist');
    clBtn.onclick=function(){ renderPolicyChecklist(po); };
    card.appendChild(clBtn); panel.appendChild(card);
  });
  body.appendChild(panel);
}

function renderPolicyChecklist(po){
  var s=curSite(), url='https://diy-booknookkit.com/'+s.prefix+po.path;
  var body=document.getElementById('body'); body.innerHTML='';
  var bb=el('div','back-bar');
  bb.innerHTML='<button class="back-btn" id="backBtn">'+L('backPolicies')+'</button><span class="back-name">'+po.name+'</span><a class="back-open" href="'+url+'" target="_blank">'+L('openPage')+'</a>';
  body.appendChild(bb);
  document.getElementById('backBtn').onclick=function(){ renderPolicyPanel(); };
  var secs=[{tag:'func',label:'Functional',items:po.items}].concat(POLICY_SHARED);
  var frag=buildRows(secs,function(no){ return po.key+'_'+no; },function(){ return url; });
  body.appendChild(frag);
  attachBtns(body);
}

function renderStandardPage(){
  var pg=curPage(), s=curSite();
  var url='https://diy-booknookkit.com/'+s.prefix+pg.path;
  var body=document.getElementById('body'); body.innerHTML='';
  var frag=buildRows(pg.sections,function(no){ return no; },function(){ return url; });
  body.appendChild(frag);
  attachBtns(body);
}

// ─── Page head & tabs ────────────────────────────────────────────────────────
function updatePageHead(){
  var pg=curPage(), s=curSite();
  var url,openHtml='';
  if(pg.isProduct){ url='https://diy-booknookkit.com/'+s.prefix+'/products'; }
  else if(pg.isPolicy){ url='https://diy-booknookkit.com/'+s.prefix+'/policies'; }
  else {
    url='https://diy-booknookkit.com/'+s.prefix+pg.path;
    var lbl=(LNG==='zh'?ZH:EN).openPage2[pg.key]||('Open '+pg.label);
    openHtml='<a class="open-btn" href="'+url+'" target="_blank">'+lbl+' ↗</a>';
  }
  var tabLbl=(LNG==='zh'?ZH:EN).tabs[pg.key]||pg.label;
  document.getElementById('pageHeadInner').innerHTML='<div class="ph-l"><div class="ph-title">'+tabLbl+'</div><div class="ph-url">'+url+'</div></div>'+openHtml;
  document.getElementById('pageHead').style.display='';
}

function updateTabs(){
  var bar=document.getElementById('tabBar'); bar.innerHTML='';
  PAGES.forEach(function(pg){
    var c=countPg(pg);
    var tabLbl=(LNG==='zh'?ZH:EN).tabs[pg.key]||pg.label;
    var badge='';
    if(c.f>0) badge='<span class="bx bx-f">'+c.f+'</span>';
    else if(c.d===c.tot&&c.tot>0) badge='<span class="bx bx-ok">✓</span>';
    var t=el('div','tab'+(activePage===pg.key?' on':''),tabLbl+badge);
    t.onclick=function(){ activePage=pg.key; renderAll(); };
    bar.appendChild(t);
  });
}

function updateProg(){
  var all=Object.values(STATE[activeSite]);
  var tot=all.length, done=all.filter(function(v){return v!==null;}).length;
  document.getElementById('progFill').style.width=(done/tot*100).toFixed(0)+'%';
  document.getElementById('progTxt').textContent=done+' / '+tot+' '+L('tested');
}

function updateFooter(){
  var all=Object.values(STATE[activeSite]);
  document.getElementById('fPass').textContent=all.filter(function(v){return v==='pass';}).length;
  document.getElementById('fFail').textContent=all.filter(function(v){return v==='fail';}).length;
  document.getElementById('fNA').textContent=all.filter(function(v){return v==='na';}).length;
}

function renderLocales(){
  var bar=document.getElementById('localeBar'); bar.innerHTML='';
  SITES.forEach(function(s){
    var b=el('button','loc'+(activeSite===s.id?' on':''),s.label);
    b.onclick=function(){ activeSite=s.id; renderAll(); };
    bar.appendChild(b);
  });
}

function renderPage(){
  var pg=curPage();
  if(pg.isProduct) renderProductPanel();
  else if(pg.isPolicy) renderPolicyPanel();
  else renderStandardPage();
}

function renderAll(){
  renderLocales();
  if(!activeSite) return;
  ['progBar','tabBar','footer'].forEach(function(id){ document.getElementById(id).style.display=''; });
  updateTabs(); updatePageHead(); updateProg(); updateFooter(); renderPage();
}

// ─── Export ────────────────────────────────────────────────────────────────────
function buildExport(){
  var s=curSite(), lines=[L('title')+' — '+s.label,''];
  PAGES.forEach(function(pg){
    if(pg.isProduct){
      PRODUCTS.forEach(function(pr){
        lines.push('=== Product: '+pr.name+' (Template: '+pr.template+') ===');
        PROD_SECS.forEach(function(sec){
          if(sec.label) lines.push('-- '+sec.label+' --');
          sec.items.forEach(function(item){
            if(item.type==='text'){ var nv=NOTES[activeSite][pr.key+'_'+item.no]; if(nv) lines.push('[NOTE] '+nv); }
            else lines.push('['+(STATE[activeSite][pr.key+'_'+item.no]||'untested').toUpperCase()+'] '+item.no+' '+item.text+evidenceText(pr.key+'_'+item.no));
          });
        }); lines.push('');
      });
    } else if(pg.isPolicy){
      POLICIES.forEach(function(po){
        lines.push('=== Policy: '+po.name+' ===');
        po.items.forEach(function(item){ lines.push('['+(STATE[activeSite][po.key+'_'+item.no]||'untested').toUpperCase()+'] '+item.no+' '+item.text+evidenceText(po.key+'_'+item.no)); });
        POLICY_SHARED.forEach(function(sec){
          if(sec.label) lines.push('-- '+sec.label+' --');
          sec.items.forEach(function(item){
            if(item.type==='text'){ var nv=NOTES[activeSite][po.key+'_'+item.no]; if(nv) lines.push('[NOTE] '+nv); }
            else lines.push('['+(STATE[activeSite][po.key+'_'+item.no]||'untested').toUpperCase()+'] '+item.no+' '+item.text+evidenceText(po.key+'_'+item.no));
          });
        }); lines.push('');
      });
    } else {
      lines.push('=== '+(pg.label)+' ===');
      pg.sections.forEach(function(sec){
        if(sec.label) lines.push('-- '+sec.label+' --');
        sec.items.forEach(function(item){
          if(item.type==='text'){ var nv=NOTES[activeSite][item.no]; if(nv) lines.push('[NOTE] '+nv); }
          else lines.push('['+(STATE[activeSite][item.no]||'untested').toUpperCase()+'] '+item.no+' '+item.text+evidenceText(item.no));
        });
      }); lines.push('');
    }
  });
  return lines.join('\n');
}

function openExport(){ document.getElementById('exportTa').value=buildExport(); document.getElementById('overlay').classList.add('open'); }
function closeExport(){ document.getElementById('overlay').classList.remove('open'); }
function doCopy(){
  var ta=document.getElementById('exportTa'); ta.select();
  try{ document.execCommand('copy'); document.getElementById('copyBtn').textContent=L('copied'); }catch(e){}
  setTimeout(function(){ document.getElementById('copyBtn').textContent=L('copy'); },2000);
}

initEvidenceInput();
renderLocales();
</script>
